name: ElevenLabs safety tests

on:
  pull_request:
    branches: [main]
    paths:
      - "motores/voz_elevenlabs/**"
      - "pasos/prueba_elevenlabs.py"
      - "pasos/p4_voz.py"
      - "nucleo/coste.py"
      - "requirements.txt"
      - ".github/workflows/test-elevenlabs.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  elevenlabs-mocked-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install project dependencies
        run: python -m pip install -r requirements.txt
      - name: Run ElevenLabs mocked tests (no real API calls)
        run: python pasos/prueba_elevenlabs.py
